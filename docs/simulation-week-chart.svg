<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>7-day offline simulation: npm run simulate:market</title>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#1a1a1a">7-day market simulation (npm run simulate:market, seed 7)</text>
  <text x="20" y="42" font-size="11" fill="#666">Two AI merchants, 6 human players, simulated PL4, no real transfers · treasury pauses below 50% of its start</text>

  <!-- plot area -->
  <g transform="translate(55,60)">
    <!-- axes -->
    <line x1="0" y1="190" x2="540" y2="190" stroke="#ccc"/>
    <line x1="0" y1="0" x2="0" y2="190" stroke="#ccc"/>
    <!-- y gridlines (treasury, left axis, in PL4) -->
    <text x="-10" y="194" font-size="10" fill="#888" text-anchor="end">0</text>
    <text x="-10" y="99" font-size="10" fill="#888" text-anchor="end">6M</text>
    <text x="-10" y="6" font-size="10" fill="#888" text-anchor="end">12M</text>
    <line x1="0" y1="99" x2="540" y2="99" stroke="#eee"/>

    <!-- treasury cash line (max ~12.22M -> scale to 190px), values in millions PL4 -->
    <polyline fill="none" stroke="#2f7d32" stroke-width="2.5"
      points="0,118.6 90,45.9 180,13.7 270,0.4 360,0.4 450,0.4 540,0.4"/>
    <!-- points -->
    <circle cx="0" cy="118.6" r="3.5" fill="#2f7d32"/>
    <circle cx="90" cy="45.9" r="3.5" fill="#2f7d32"/>
    <circle cx="180" cy="13.7" r="3.5" fill="#2f7d32"/>
    <circle cx="270" cy="0.4" r="3.5" fill="#2f7d32"/>
    <circle cx="360" cy="0.4" r="3.5" fill="#2f7d32"/>
    <circle cx="450" cy="0.4" r="3.5" fill="#2f7d32"/>
    <circle cx="540" cy="0.4" r="3.5" fill="#2f7d32"/>

    <!-- active listings, right axis 0-45, dashed amber line -->
    <polyline fill="none" stroke="#c77700" stroke-width="2" stroke-dasharray="5,3"
      points="0,106.6 90,57.8 180,22.4 270,22.4 360,13.6 450,13.6 540,13.6"/>
    <circle cx="0" cy="106.6" r="3" fill="#c77700"/>
    <circle cx="90" cy="57.8" r="3" fill="#c77700"/>
    <circle cx="180" cy="22.4" r="3" fill="#c77700"/>
    <circle cx="270" cy="22.4" r="3" fill="#c77700"/>
    <circle cx="360" cy="13.6" r="3" fill="#c77700"/>
    <circle cx="450" cy="13.6" r="3" fill="#c77700"/>
    <circle cx="540" cy="13.6" r="3" fill="#c77700"/>

    <!-- day labels -->
    <g font-size="10" fill="#888" text-anchor="middle">
      <text x="0" y="206">day 1</text>
      <text x="90" y="206">2</text>
      <text x="180" y="206">3</text>
      <text x="270" y="206">4</text>
      <text x="360" y="206">5</text>
      <text x="450" y="206">6</text>
      <text x="540" y="206">7</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#333">
    <rect x="300" y="18" width="14" height="3" fill="#2f7d32"/>
    <text x="318" y="23">Merchant treasury (cash, PL4) — pauses never triggered</text>
    <line x1="300" y1="34" x2="314" y2="34" stroke="#c77700" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="318" y="38">Active listings (count)</text>
  </g>

  <text x="20" y="286" font-size="10" fill="#999">22 → 39 active listings, treasury 4.56M → 12.22M simulated PL4 (plateaus day 4 as the daily spend cap binds), 0 real transfers.</text>
</svg>
