<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planet4 — Космобарахолка</title><style>
:root{--ink:#171b16;--acid:#d7e86a;--muted:#adae97;--panel:#373a30;--gold:#ebbd68}*{box-sizing:border-box}body{margin:0;background:#171d1c;color:#efedda;font:15px system-ui,sans-serif;background-image:radial-gradient(ellipse at 15% 10%,#56634a55,transparent 55%),radial-gradient(ellipse at 90% 80%,#8a684633,transparent 50%)}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acid);outline-offset:3px}header{max-width:1100px;margin:auto;padding:25px 22px;display:flex;align-items:center;gap:12px}.brand{font-weight:1000;letter-spacing:-2px;font-size:27px;color:var(--acid);transform:rotate(-3deg)}.tiny{font-size:11px;letter-spacing:2px;color:var(--muted)}.switch{margin-left:auto;display:flex;background:#111713;border:1px solid #555a48;border-radius:9px;padding:4px}.switch button{border:0;background:transparent;padding:8px 12px;border-radius:5px;font-size:12px}.switch button.active{background:var(--acid);color:var(--ink);font-weight:800}.shell{max-width:1060px;margin:0 auto 115px;padding:0 20px}.hero{position:relative;overflow:hidden;min-height:205px;display:flex;align-items:center;padding:25px 30px;border:2px solid #151912;border-radius:19px 19px 5px 5px;background:linear-gradient(110deg,#4d5540,#393b2d);box-shadow:0 6px 0 #101610}.hero:before{content:'';position:absolute;width:480px;height:480px;border:2px dashed #a1ad6450;border-radius:50%;right:-130px;top:-220px}.hero h1{font-size:clamp(31px,5vw,49px);line-height:1;margin:9px 0 12px;letter-spacing:-2px;text-shadow:3px 3px #20281c;transform:rotate(-2deg)}.hero p{color:#d0d2bb;max-width:360px;margin:0;font-size:13px}.sign{display:inline-block;background:#dfbc71;color:#25281c;padding:5px 9px;transform:rotate(-3deg);font-size:10px;font-weight:900;letter-spacing:2px;border:2px solid #202319}.merchant{position:absolute;right:8%;bottom:-15px;width:230px;filter:drop-shadow(5px 8px 0 #1b211a)}.hero-copy{z-index:1;max-width:65%}.wallet{display:flex;gap:20px;flex-wrap:wrap;margin:23px 0 18px;align-items:center}.balance{font-size:19px;font-weight:800}.balance small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-bottom:3px}.demo{margin-left:auto;color:#b8c389;font-size:11px;border:1px dashed #65714d;padding:7px 10px;border-radius:5px}.tabs{display:flex;gap:7px;border-bottom:2px solid #62674a;padding-bottom:0}.tabs button{border:2px solid #62674a;border-bottom:0;border-radius:9px 9px 0 0;background:#252d25;padding:12px 21px;font-weight:800;color:#adb299}.tabs button.active{background:var(--acid);color:#20271b;border-color:var(--acid)}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:20px 0 14px}.pills{display:flex;gap:5px;margin-right:auto}.pills button{padding:8px 13px;border:1px solid #535e45;background:#252c24;border-radius:6px;font-size:12px}.pills button.active{background:#606c43;color:#fff;border-color:#9aaa66}select,input{border:1px solid #60634e;background:#272e27;color:#e0e3cf;border-radius:6px;padding:9px 10px;font-size:12px;min-height:36px}input[type=search]{width:165px}#status{font-size:12px;color:var(--muted);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{position:relative;text-align:left;padding:0;overflow:hidden;background:linear-gradient(145deg,#3c4235,#292f29);border:2px solid #151d17;border-radius:10px;box-shadow:0 3px 0 #101610;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-4px);border-color:var(--c)}.art{height:145px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--c) 18%,transparent),transparent 67%);position:relative}.art svg{width:115px;height:115px;filter:drop-shadow(4px 7px 0 #171e18)}.rarity{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--c);font-weight:800}.card-info{padding:12px 13px 13px;border-top:1px solid #6f765430}.card h3{margin:5px 0;font-size:14px;min-height:20px}.stats{font-size:11px;color:#aeb69c}.price{margin-top:13px;display:flex;justify-content:space-between;align-items:center;color:var(--acid);font-weight:900}.level{position:absolute;top:9px;right:9px;font-size:11px;background:#171e18;border:1px solid #62694f;border-radius:4px;padding:3px 5px;color:var(--gold)}.empty{grid-column:1/-1;text-align:center;padding:70px 15px;color:var(--muted);border:1px dashed #5b654b;border-radius:10px}.hint{font-size:11px;color:#a7ad94;padding:20px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,650px);background:linear-gradient(#353a2f,#20271f);border:2px solid #151b15;border-bottom:0;border-radius:16px 16px 0 0;display:grid;grid-template-columns:repeat(6,1fr);padding:9px 4px 12px;z-index:5;box-shadow:0 -8px 40px #0008}.nav div{text-align:center;font-size:9px;font-weight:900;color:#bac1a6}.nav span{display:block;font-size:26px;filter:grayscale(.55);margin-bottom:4px}.nav .chosen{color:var(--acid)}.nav .chosen span{filter:none}.overlay{position:fixed;inset:0;background:#090e0bdc;backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;z-index:20}.overlay[hidden]{display:none}.modal{width:100%;max-width:390px;max-height:90vh;overflow:auto;background:linear-gradient(140deg,#434a38,#2b3329);border:2px solid #7d875d;border-radius:15px;padding:23px;box-shadow:7px 8px 0 #10180f;position:relative}.close{position:absolute;right:11px;top:10px;background:#222b21;border:1px solid #75805b;border-radius:5px;width:30px;height:30px}.modal .art{height:130px}.modal h2{font-size:23px;margin:8px 0}.desc{font-size:13px;line-height:1.6;color:#bac4a9}.detail{display:flex;justify-content:space-between;border-bottom:1px solid #626c493f;padding:10px 0;font-size:13px}.primary{width:100%;padding:13px;background:var(--acid);color:#222a18;border:2px solid #171e13;border-radius:7px;font-weight:900;box-shadow:0 3px 0 #11180e;margin-top:17px}.modal input{width:100%;margin:5px 0}.label{display:block;font-size:12px;margin-top:17px;color:#c7cfb5}.note{font-size:11px;line-height:1.6;color:#aeb99c;margin-top:12px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#d8e987;color:#24301c;border:2px solid #1c2818;box-shadow:0 4px 15px #0006;padding:12px 20px;border-radius:8px;z-index:30;font-size:13px;font-weight:700;width:max-content;max-width:90%;text-align:center}.reset{background:transparent;border:0;color:#a6b38a;text-decoration:underline;font-size:11px}.history-row{padding:14px 0;border-bottom:1px solid #6a745044;font-size:12px;line-height:1.7}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}.shell{padding:0 30px}}@media(max-width:620px){header{padding:14px 15px}.tiny{display:none}.shell{padding:0 12px}.hero{min-height:170px;padding:20px 17px}.merchant{width:170px;right:-28px}.hero-copy{max-width:72%}.hero h1{font-size:34px}.hero p{font-size:11px;max-width:210px}.sign{font-size:8px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.art{height:127px}.card-info{padding:10px}.card h3{font-size:12px}.wallet{gap:18px}.balance{font-size:16px}.demo{font-size:9px;padding:5px}.tabs button{flex:1;font-size:13px;padding:12px 10px}.toolbar{gap:7px}.pills{width:100%;margin-bottom:5px}.pills button{flex:1}input[type=search]{width:100%;order:3}select{flex:1;min-width:0}.nav span{font-size:23px}.nav div{font-size:8px}}
</style></head><body><header><div class="brand">PLANET4</div><span class="tiny">НЕПОТРІБ ОДНОГО — СКАРБ ІНШОГО</span><div class="switch"><button id="web" onclick="mode('web')">Вебверсія</button><button id="tg" onclick="mode('tg')">Telegram</button></div></header><main class="shell"><section class="hero"><div class="hero-copy"><div class="sign">СЕКТОР 04 / БАРАХОЛКА</div><h1>Шмот із других<br>щупалець.</h1><p id="intro">Здавай зайве торговцю. А те, що шкода віддати за копійки, виставляй гравцям.</p></div><svg class="merchant" viewBox="0 0 240 240" aria-label="Інопланетний торговець"><g stroke="#182019" stroke-width="5" stroke-linejoin="round"><path fill="#75694b" d="M24 233l22-85 55-22 75 11 43 96z"/><path fill="#a2b365" d="M62 130L44 77 65 39l27 10 42-29 22 29 35-5 17 44-32 58-63 14z"/><path fill="#687c43" d="M55 91l23 26 64 18 44-28-12 38-61 14-51-29z"/><path fill="#e7d99a" d="M76 65q39-20 62 11-26 37-62-11z"/><ellipse fill="#d17c47" cx="109" cy="77" rx="12" ry="17"/><ellipse fill="#16211b" cx="111" cy="77" rx="5" ry="14"/><path fill="#e8ddac" d="M148 65q26-20 40 8-23 24-40-8z"/><circle fill="#20271c" cx="169" cy="72" r="7"/><path fill="#252c20" d="M83 117q43-32 81 0l-18 20-41-3z"/><path fill="#e0d6a7" d="M95 111l9 18 9-24 10 25 12-25 9 20 8-15"/><path fill="#b48c50" d="M52 158l35-9 22 49 28-51 38 8-8 77H65z"/><path fill="#413d2e" d="M92 191l19 13 22-14 7 42H89z"/><path fill="#a7b76b" d="M13 199q31-36 49-5l-10 28-35 3zM179 189q41-17 50 17l-16 23-36-7z"/><path fill="#8e8464" d="M0 221h240v19H0z"/><circle fill="#d7e86a" cx="159" cy="173" r="8"/><path fill="none" d="M52 77l22 9M198 90l-14 6"/></g></svg></section><div class="wallet"><div class="balance"><small>МЕТАЛОБРУХТ</small><span id="scrap"></span> ⚙</div><div class="balance" id="p4balance"><small>ГАМАНЕЦЬ P4</small><span id="p4"></span> P4</div><span class="demo">● ДЕМО · без реальних платежів</span></div><div class="tabs"><button id="npcTab" onclick="tab('npc')">Торговець NPC</button><button id="marketTab" onclick="tab('market')">Ринок P4</button></div><div class="toolbar"><div class="pills" id="subtabs"></div><input type="search" id="search" placeholder="Знайти річ…" oninput="render()" aria-label="Пошук предмета"><select id="type" onchange="render()" aria-label="Тип предмета"><option value="">Усі типи</option>Зброя</option>Броня</option>Шолом</option>Чоботи</option></select><select id="rarity" onchange="render()" aria-label="Рідкість"><option value="">Уся рідкість</option>Звичайний</option>Рідкісний</option>Епічний</option></select><select id="sort" onchange="render()" aria-label="Сортування"><option value="new">Спочатку нові</option><option value="cheap">Спочатку дешевші</option><option value="expensive">Спочатку дорожчі</option><option value="level">За рівнем</option></select></div><div id="status"></div><div class="grid" id="grid"></div><div class="hint" id="hint"></div><button class="reset" onclick="resetDemo()">Почати демо спочатку</button></main><nav class="nav" aria-label="Меню гри"><div><span>👾</span>БОСИ</div><div><span>🗺️</span>КВЕСТИ</div><div><span>🧑🏻</span>ГЕРОЙ</div><div><span>🧠</span>ТАЛАНТИ</div><div><span>🚩</span>КЛАНИ</div><div class="chosen"><span>🧰</span>МАРКЕТ</div></nav><div class="overlay" id="overlay" hidden onclick="if(event.target===this)closeModal()"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Предмет"></section></div><div id="toast" class="toast" hidden role="status"></div>
<script>
const colors={'Звичайний':'#a6b59a','Рідкісний':'#7eb9ca','Епічний':'#bd93d8'};
const base=[['Зубодробилка','Зброя','Епічний',72,5,820,1600,'damage','Ідеально для переговорів, які зайшли в глухий кут.'],['Куртка утилізатора','Броня','Рідкісний',65,3,460,850,'armor','Запах попереднього власника додається безкоштовно.'],['Каска «Не бий»','Шолом','Звичайний',40,0,170,210,'helmet','Напис не працює. Каска — іноді.'],['Черевики втікача','Чоботи','Рідкісний',58,2,320,620,'boots','Пробіг невідомий. Власник теж.'],['Арматура переконання','Зброя','Звичайний',32,1,120,180,'damage','Один аргумент. Зате залізний.'],['Жилет із холодильника','Броня','Епічний',70,4,760,1400,'armor','Зберігає свіжість навіть після третього боса.'],['Каска мислителя','Шолом','Рідкісний',62,2,390,720,'helmet','Не додає розуму, але добре його захищає.'],['Гравітапки','Чоботи','Епічний',74,6,920,1900,'boots','Підлога — це лише рекомендація.']];
function seed(){return {scrap:12450,p4:4800,items:base.map((a,i)=>({id:i+1,name:a[0],type:a[1],rarity:a[2],level:a[3],plus:a[4],npc:a[5],price:a[6],art:a[7],desc:a[8],state:'inventory'})),offers:base.slice(0,6).map((a,i)=>({id:100+i,name:a[0],type:a[1],rarity:a[2],level:a[3],plus:a[4],npc:a[5],price:a[6],art:a[7],desc:a[8],seller:['trashlord.near','cosmocat.near','boltman.near'][i%3]})),history:[],next:200}}
let s;try{s=JSON.parse(localStorage.getItem('planet4market-v1'))||seed()}catch{s=seed()}let platform='web',section='npc',view='buy',selected=null,lastFocus=null,timer;
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('uk-UA');function save(){try{localStorage.setItem('planet4market-v1',JSON.stringify(s))}catch{}}function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3500)}
function art(kind,color){let shapes={damage:'<path fill="#8c9b78" d="M53 12l23 9-8 53-23-8z"/><path fill="#c8c7a7" d="M55 14l9 6-6 48-10-3z"/><path fill="#ba8b55" d="M43 67l23 6-6 14-8-2-7 28-12-4 8-28-7-3z"/><path fill="#ddd6a6" d="M64 26l20-4 4 8-23 7M59 47l21-4 3 8-22 8"/>',armor:'<path fill="#827f58" d="M39 22l15-6 14 9 13-8 14 10 17 25-17 13-6-9 5 53-60 2 5-55-9 10-16-14z"/><path fill="#b4ad75" d="M54 17l13 23 15-22-2 45-15 15-14-14z"/><path fill="#585e45" d="M47 78h14v20H45zM74 76h14v20H75z"/><circle fill="#d6e774" cx="66" cy="58" r="8"/>',helmet:'<path fill="#959368" d="M26 73q-6-52 40-55 43 0 42 52l-12 18-57 1z"/><path fill="#596451" d="M35 61l58-5 3 24-17 17-34-11z"/><path fill="#d4df7d" d="M43 65l18 2-4 12-16-4zM73 67l14-5 3 11-15 7z"/><path fill="#bf8e54" d="M57 19l8-9 10 6-5 38-12-2z"/>',boots:'<path fill="#a08a59" d="M27 20l28 3-5 46 9 21-4 18-40-3-1-18 15-14zM76 19l27 5-5 46 14 15-3 22-42 1-3-17 14-19z"/><path fill="#61704f" d="M24 37l29 2-2 11-29-2zM75 38l27 2-2 11-26-2z"/><path fill="#c2be8b" d="M15 94l40 2-1 12-40-3zM67 96l43-1-1 12-42 1z"/>'};return `<svg viewBox="0 0 130 130" aria-hidden="true"><g stroke="#182119" stroke-width="3.5" stroke-linejoin="round">${shapes[kind]}</g></svg>`}
function mode(m){platform=m;if(m==='tg')section='npc';closeModal();render()}function tab(t){section=t;view='buy';closeModal();render()}function sub(v){view=v;render()}function available(){return s.items.filter(i=>i.state==='inventory')}
function render(){ $('web').classList.toggle('active',platform==='web');$('tg').classList.toggle('active',platform==='tg');$('marketTab').hidden=platform==='tg';$('p4balance').hidden=platform==='tg';$('npcTab').classList.toggle('active',section==='npc');$('marketTab').classList.toggle('active',section==='market');$('scrap').textContent=fmt(s.scrap);$('p4').textContent=fmt(s.p4);$('intro').textContent=platform==='tg'?'Торговець забере зайвий шмот. За металобрухт. Обійми в ціну не входять.':'Здавай зайве торговцю. А те, що шкода віддати за копійки, виставляй гравцям.';
$('subtabs').innerHTML=section==='market'?['buy','sell','lots','history'].map((v,i)=>`<button class="${view===v?'active':''}" onclick="sub('${v}')">${['Купити','Продати','Мої лоти','Історія'][i]}</button>`).join(''):'<span class="tiny">ВАШ ІНВЕНТАР</span>';
if(section==='market'&&view==='history'){$('grid').innerHTML=s.history.length?s.history.slice().reverse().map(h=>`<div class="history-row">${h}</div>`).join(''):'<div class="empty">Угод ще немає. Час знайти покупця.</div>';$('status').textContent='Історія тестових угод';$('hint').textContent='Усі операції в цьому прототипі — симуляція.';return}
let rows=section==='npc'||view==='sell'?available():view==='lots'?s.items.filter(i=>i.state==='listed'):s.offers;let q=$('search').value.trim().toLowerCase();rows=rows.filter(i=>(!$('type').value||i.type===$('type').value)&&(!$('rarity').value||i.rarity===$('rarity').value)&&i.name.toLowerCase().includes(q));let price=i=>section==='npc'?i.npc:i.price;rows=[...rows].sort((a,b)=>$('sort').value==='cheap'?price(a)-price(b):$('sort').value==='expensive'?price(b)-price(a):$('sort').value==='level'?b.level-a.level:b.id-a.id);
$('status').textContent=`${section==='npc'?'Торговець готовий купити':view==='sell'?'Виберіть річ для продажу':view==='lots'?'Ваші активні оголошення':'Пропозиції гравців'} · ${rows.length} речей`;
$('grid').innerHTML=rows.length?rows.map(i=>`<button class="card" style="--c:${colors[i.rarity]}" onclick="openItem(${i.id})"><div class="art">${art(i.art)}<span class="level">${i.level} LVL ${i.plus?'· +'+i.plus:''}</span></div><div class="card-info"><div class="rarity">${i.rarity}</div><h3>${i.name}</h3><div class="stats">${i.type} · ${i.art==='damage'?'Урон':'Захист'} +${i.level*3+i.plus*15}</div><div class="price"><span>${fmt(price(i))} ${section==='npc'?'⚙':'P4'}</span><span style="font-size:11px">${section==='npc'?'Продати ↗':view==='sell'?'Виставити ↗':view==='lots'?'Керувати ↗':'Купити ↗'}</span></div></div></button>`).join(''):'<div class="empty">Тут поки порожньо.<br>Змініть фільтри або виберіть іншу вкладку.</div>';
$('hint').textContent=section==='npc'?'Надягнені, захищені та виставлені на ринок речі недоступні для продажу.':view==='sell'?'Комісія — 3% із продавця. Перед виставленням ви побачите точну суму.':view==='lots'?'Виставлені речі заблоковані. Скасуйте лот, щоб повернути річ в інвентар.':'Ціна в P4. Комісія маркету вже входить у ціну. Тестовий баланс: без підключення гаманця.';}
function openItem(id){selected=(section==='market'&&view==='buy'?s.offers:s.items).find(i=>i.id===id);if(!selected)return;lastFocus=document.activeElement;const i=selected;let sell=section==='market'&&view==='sell',lot=section==='market'&&view==='lots';$('modal').innerHTML=`<button class="close" onclick="closeModal()" aria-label="Закрити">✕</button><div class="art" style="--c:${colors[i.rarity]}">${art(i.art)}</div><div class="rarity" style="color:${colors[i.rarity]}">${i.rarity} · Рівень ${i.level}${i.plus?' · +'+i.plus:''}</div><h2>${i.name}</h2><p class="desc">${i.desc}</p><div class="detail"><span>${i.art==='damage'?'Урон':'Захист'}</span><b>+${i.level*3+i.plus*15}</b></div>${sell?`<label class="label" for="asking">Ціна продажу, P4</label><input id="asking" type="number" min="1" max="1000000000" step="1" value="${i.price}" oninput="quote()"><div id="quote"></div>`:`<div class="detail"><span>${section==='npc'?'Ви отримаєте':'Ціна'}</span><b>${fmt(section==='npc'?i.npc:i.price)} ${section==='npc'?'металобрухту':'P4'}</b></div>${section==='market'&&!lot?'<div class="detail"><span>Продавець</span><b>'+i.seller+'</b></div>':''}` }<button class="primary" id="action" onclick="act()">${section==='npc'?'Підтвердити продаж NPC':sell?'Виставити на ринок':lot?'Зняти з продажу':'Підтвердити тестову покупку'}</button><div class="note">${section==='npc'?'Після продажу річ буде видалено з інвентарю.':sell?'Річ буде заблокована до продажу або скасування лота.':lot?'Річ повернеться у ваш інвентар без комісії.':'Демо: P4 списуються лише з тестового балансу. Реальних транзакцій немає.'}</div>`;$('overlay').hidden=false;if(sell)quote();$('modal').querySelector('button').focus()}
function quote(){let p=Number($('asking').value),valid=Number.isSafeInteger(p)&&p>=1&&p<=1e9;let fee=Math.round(p*3)/100;$('quote').innerHTML=valid?`<div class="detail"><span>Комісія 3%</span><b>${fmt(fee)} P4</b></div><div class="detail"><span>Ви отримаєте</span><b style="color:var(--acid)">${fmt(Math.round((p-fee)*100)/100)} P4</b></div>`:'<p class="note">Введіть цілу ціну від 1 до 1 000 000 000 P4.</p>';$('action').disabled=!valid}
function act(){let i=selected;if(!i)return;if(section==='npc'){if(i.state!=='inventory')return;i.state='sold';s.scrap+=i.npc;s.history.push(`Продано NPC: ${i.name} · +${fmt(i.npc)} металобрухту`);toast(`Продано! +${fmt(i.npc)} металобрухту`)}else if(view==='sell'){let p=Number($('asking').value);if(!Number.isSafeInteger(p)||p<1||p>1e9||i.state!=='inventory')return;i.price=p;i.state='listed';toast('Лот виставлено. Річ заблокована.')}else if(view==='lots'){if(i.state!=='listed')return;i.state='inventory';toast('Лот скасовано. Річ повернуто.')}else{if(!s.offers.some(o=>o.id===i.id))return;if(s.p4<i.price){toast('Недостатньо тестових P4');return}s.p4-=i.price;s.offers=s.offers.filter(o=>o.id!==i.id);s.items.push({...i,id:s.next++,state:'inventory'});s.history.push(`Куплено: ${i.name} · −${fmt(i.price)} P4`);toast('Куплено! Річ уже у вашому інвентарі.')}save();closeModal();render()}
function closeModal(){$('overlay').hidden=true;selected=null;if(lastFocus?.isConnected)lastFocus.focus()}
function resetDemo(){if(!confirm('Скинути тестові покупки, продажі та лоти?'))return;s=seed();save();closeModal();render();toast('Демо почато спочатку')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('overlay').hidden){let f=[...$('modal').querySelectorAll('button:not(:disabled),input')],first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
