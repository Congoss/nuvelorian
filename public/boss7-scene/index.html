<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бос 22 — жива ілюстрація</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121419;color:#eee;font:15px system-ui}main{display:grid;grid-template-columns:1fr 280px;min-height:100svh}.stage{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 65%,#454133,#16191f 70%);overflow:hidden}canvas{height:96svh;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 14px #0008)}aside{padding:30px 24px;background:#1d2026}h1{font-size:21px;margin:0 0 8px}p{color:#aeb4c0;line-height:1.5}label{display:flex;gap:10px;margin:22px 0;align-items:center}input[type=range]{width:100%;accent-color:#e3b95f}input[type=checkbox]{accent-color:#e3b95f}button{background:#e3b95f;color:#171719;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;font:inherit;width:100%}select{background:#30343c;color:white;padding:8px;border-radius:6px;width:100%}output{color:#e3b95f}#status{font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr}.stage{height:75svh}canvas{height:73svh}aside{padding:20px}label{margin:15px 0}}
.figure{position:relative;line-height:0;max-width:100%}canvas{display:block;cursor:crosshair}.anger{position:absolute;left:59%;top:8%;width:9%;height:auto;opacity:0;pointer-events:none;filter:drop-shadow(0 0 5px #f3383870)}.struck .anger{animation:anger-pop .65s both}@keyframes anger-pop{0%{opacity:0;transform:scale(.3) rotate(-22deg)}12%{opacity:1;transform:scale(1.2) rotate(8deg)}28%,65%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:translateY(-14px) scale(.85)}}.hint{font-size:12px;margin:8px 0 16px;text-align:center}#hit{background:#c74843;color:white}
#pet{position:absolute;left:60%;bottom:1%;width:46%;height:auto;max-width:none;cursor:default;filter:drop-shadow(0 8px 5px #0006)}#pet[hidden]{display:none}aside{max-height:100svh;overflow-y:auto}.stage{height:100svh}@media(max-width:700px){aside{max-height:none}.stage{height:75svh}}hr{border:0;border-top:1px solid #41454e;margin-top:28px}#pet-status{font-size:12px}.stage{position:relative;isolation:isolate}#arena{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;filter:none;pointer-events:none;z-index:-1}#arena[hidden]{display:none}#arena-status{font-size:12px}aside{display:none}main{display:block;height:100svh;min-height:0}.stage{height:100svh;padding:58px 0 240px}.figure{max-height:100%;max-width:100%}#boss{object-fit:contain;height:calc(100svh - 300px);max-height:100%;max-width:100%;width:auto}#pet{width:46%}@media(max-height:500px){.stage{padding:42px 0 130px}#boss{height:calc(100svh - 172px)}}
.stage{background:#16191f url('arena.webp') center/cover}#boss{background:url('boss-22.webp') center/contain no-repeat}#pet{background:url('pet-base.webp') center/contain no-repeat}</style>
<main><div class="stage"><canvas id="arena" width="853" height="1280" aria-label="Анімований фон єгипетського храму"></canvas><div class="figure"><canvas id="boss" width="853" height="1280" aria-label="Анімований бос — мумія"></canvas><svg class="anger" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M25 7L29 22L16 26M42 9L39 23L53 27M10 40L25 37L28 53M43 53L39 39L54 36" stroke="#250e10" stroke-width="12"/><path d="M25 7L29 22L16 26M42 9L39 23L53 27M10 40L25 37L28 53M43 53L39 39L54 36" stroke="#ff383e" stroke-width="6"/></g></svg><canvas id="pet" width="800" height="800" aria-label="Пет із космічними очима"></canvas></div></div><aside><h1>Жива мумія</h1><p>Волосся, бинти, черви, руки та золоті прикраси.</p><button id="hit">Удар</button><p class="hint">Або натисни на боса</p><button id="pause">Пауза</button><label>Сила руху <output id="amount">100%</output></label><input id="strength" type="range" min="0" max="200" value="100"><label><input type="checkbox" id="arms" checked>Погойдування рук</label><label><input type="checkbox" id="hair" checked>Хвилювання волосся</label><label><input type="checkbox" id="cloth" checked>Рух бинтів</label><label><input type="checkbox" id="worms" checked>Ворушіння черв’яків</label><label><input type="checkbox" id="shine" checked>Блиск золота</label><label><input type="checkbox" id="breath" checked>Дихання</label><label for="background">Тло</label><select id="background"><option value="temple" selected>Єгипетський храм</option><option value="dark">Темне</option><option value="sand">Пісочне</option><option value="yellow">Оригінальне жовте</option></select><label><input type="checkbox" id="arena-fire" checked>Вогонь і світло</label><label><input type="checkbox" id="arena-dust" checked>Повільний пил</label><label><input type="checkbox" id="arena-haze" checked>Легкий димок</label><p id="arena-status">Завантаження фону…</p><hr><label><input type="checkbox" id="pet-visible" checked>Пет біля ноги</label><label for="pet-size">Розмір пета</label><input id="pet-size" type="range" min="25" max="65" value="46"><label><input type="checkbox" id="pet-crouch" checked>Легке присідання</label><label><input type="checkbox" id="pet-tongues" checked>Рух язиків</label><label><input type="checkbox" id="pet-pendant" checked>Кулон на вусі</label><label><input type="checkbox" id="pet-eyes" checked>Космічні очі</label><label><input type="checkbox" id="pet-tail" checked>Рух хвоста</label><p id="pet-status">Завантаження пета…</p><p id="status">Завантаження…</p></aside></main>
<script src="bridge.js?v=5"></script><script src="preview.js?v=5"></script><script src="pet.js?v=5"></script><script src="background.js?v=5"></script></html>
